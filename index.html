<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vidloader</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #edf5f1; background: #0c1214; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; }
    main { width: min(660px, 100%); background: #172023; border: 1px solid #2a393b; border-radius: 20px; box-shadow: 0 16px 50px #0005; padding: 32px; }
    h1 { margin: 0 0 7px; font-size: 28px; letter-spacing: -.04em; }
    p { margin: 0; color: #a9bab3; line-height: 1.5; }
    label { display: block; font-size: 14px; font-weight: 650; margin: 18px 0 7px; }
    input, select { width: 100%; padding: 12px 13px; border: 1px solid #3a4a4b; border-radius: 10px; background: #202b2d; color: #edf5f1; font: inherit; outline: none; }
    input:focus, select:focus { border-color: #38c784; box-shadow: 0 0 0 3px #38c78433; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 22px; font-weight: 500; line-height: 1.4; }
    .check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: #38c784; flex: none; }
    .actions { display: flex; gap: 10px; margin-top: 25px; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; font: inherit; font-weight: 650; cursor: pointer; }
    #start { background: #2ebf79; color: #082115; flex: 1; }
    #start:hover { background: #42d38c; }
    #stop { background: #2a383a; color: #e0ebe5; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .status { margin-top: 25px; padding: 17px; background: #1d292a; border: 1px solid #304143; border-radius: 12px; }
    .status strong { display: block; font-size: 15px; margin-bottom: 5px; }
    .bar { height: 8px; background: #354744; border-radius: 10px; overflow: hidden; margin-top: 14px; }
    .bar > div { height: 100%; width: 0; background: #38c784; transition: width .2s; }
    #meta, #filename { font-size: 12px; margin-top: 8px; overflow-wrap: anywhere; }
    .chrome { padding: 14px 16px; border: 1px solid #304143; border-radius: 12px; background: #1d292a; margin: 18px 0 4px; }
    .chrome p { font-size: 14px; }
    .chrome button { background: transparent; color: #62daa0; padding: 5px 0 0; font-size: 13px; }
    #extension-help { margin-top: 10px; }
    #extension-folder { color: #edf5f1; overflow-wrap: anywhere; user-select: all; }
    .foot { display: flex; justify-content: flex-end; margin-top: 18px; }
    .foot button { background: transparent; color: #a9bab3; font-size: 12px; padding: 3px; font-weight: 500; }
    @media (max-width: 520px) { main { padding: 23px; } .row { grid-template-columns: 1fr; gap: 0; } .actions { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <h1>Vidloader</h1>
    <div class="chrome">
      <p><strong>Chrome:</strong> откройте видео и нажмите значок Vidloader в браузере.</p>
      <button id="extension-setup" type="button">Настроить расширение</button>
      <div id="extension-help" hidden>
        <p>В Chrome включите «Режим разработчика», нажмите «Загрузить распакованное расширение» и выберите эту папку:</p>
        <p id="extension-folder"></p>
        <button id="copy-extension-folder" type="button">Скопировать путь</button>
      </div>
    </div>
    <form id="form">
      <label for="url">Ссылка на видео</label>
      <input id="url" type="url" placeholder="https://…" autocomplete="off" required autofocus>
      <div class="row">
        <div>
          <label for="browser">Вход через браузер</label>
          <select id="browser">
            <option value="chrome">Chrome</option>
            <option value="edge">Edge</option>
            <option value="firefox">Firefox</option>
            <option value="safari">Safari (macOS)</option>
            <option value="brave">Brave</option>
            <option value="cookies">Файл cookies.txt (Chrome/Яндекс)</option>
            <option value="none">Не требуется</option>
          </select>
        </div>
        <div>
          <label for="quality">Качество</label>
          <select id="quality">
            <option value="best">Лучшее доступное</option>
            <option value="1080">До 1080p</option>
            <option value="720">До 720p</option>
            <option value="480">До 480p</option>
            <option value="360">До 360p</option>
          </select>
        </div>
      </div>
      <div id="cookie-row" hidden>
        <label for="cookie-file">Файл cookies.txt</label>
        <input id="cookie-file" type="file" accept=".txt,text/plain">
      </div>
      <label for="folder">Папка сохранения</label>
      <input id="folder" type="text" value="~/Downloads" required>
      <label class="check"><input id="insecure" type="checkbox"><span>Пропустить проверку сертификата</span></label>
      <div class="actions">
        <button id="start" type="submit">Скачать видео</button>
        <button id="stop" type="button" disabled>Остановить</button>
      </div>
    </form>
    <div class="status" aria-live="polite">
      <strong id="stage">Готово к загрузке</strong>
      <p id="message"></p>
      <div class="bar"><div id="bar"></div></div>
      <p id="meta"></p>
      <p id="filename"></p>
    </div>
    <div class="foot"><button id="close" type="button">Закрыть приложение</button></div>
  </main>
  <script>
    const token = "__APP_TOKEN__";
    const $ = id => document.getElementById(id);
    const active = new Set(["connecting", "downloading", "processing"]);
    const windows = navigator.userAgent.includes("Windows");
    let closed = false;
    const saved = JSON.parse(localStorage.getItem("video-downloader-settings") || "{}");
    for (const key of ["browser", "quality", "folder"]) if (saved[key]) $(key).value = saved[key];
    $("browser").querySelector('[value="chrome"]').hidden = windows;
    if (windows && (!saved.browser || saved.browser === "chrome")) $("browser").value = "none";
    function updateCookieField() {
      const enabled = $("browser").value === "cookies";
      $("cookie-row").hidden = !enabled;
      $("cookie-file").required = enabled;
    }
    $("browser").addEventListener("change", updateCookieField);
    updateCookieField();
    async function api(path, data) {
      const response = await fetch(path, {
        method: data === undefined ? "GET" : "POST",
        headers: {"X-App-Token": token, "Content-Type": "application/json"},
        body: data === undefined ? undefined : JSON.stringify(data)
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "Ошибка приложения");
      return result;
    }
    async function syncSettings() {
      try {
        await api("/api/settings", {quality: $("quality").value, folder: $("folder").value.trim(), insecure: $("insecure").checked});
      } catch (_) {}
    }
    for (const key of ["quality", "folder", "insecure"]) $(key).addEventListener("change", syncSettings);
    $("extension-setup").addEventListener("click", async () => {
      try {
        const {folder} = await api("/api/extension/setup");
        $("extension-folder").textContent = folder;
        $("extension-help").hidden = false;
        await api("/api/extension/open-setup", {});
      } catch (error) { $("message").textContent = error.message; }
    });
    $("copy-extension-folder").addEventListener("click", async () => {
      await navigator.clipboard.writeText($("extension-folder").textContent);
      $("copy-extension-folder").textContent = "Скопировано";
    });
    async function refresh() {
      if (closed) return;
      try {
        const state = await api("/api/status");
        const busy = active.has(state.stage);
        $("start").disabled = busy;
        $("stop").disabled = !busy;
        $("stage").textContent = ({idle: "Готово к загрузке", connecting: "Подключение", downloading: "Скачивание", processing: "Обработка", done: "Готово", cancelled: "Остановлено", error: "Ошибка"})[state.stage] || state.stage;
        $("message").textContent = state.message || "";
        $("bar").style.width = `${Math.max(0, Math.min(100, state.percent || 0))}%`;
        $("meta").textContent = [state.bytes_text, state.speed].filter(Boolean).join(" · ");
        $("filename").textContent = state.stage === "done" ? state.filename || "" : "";
      } catch (error) {
        if (!closed) $("message").textContent = error.message;
      }
    }
    $("form").addEventListener("submit", async event => {
      event.preventDefault();
      const data = {
        url: $("url").value.trim(), browser: $("browser").value,
        quality: $("quality").value, folder: $("folder").value.trim(),
        insecure: $("insecure").checked
      };
      if (data.browser === "cookies") {
        const file = $("cookie-file").files[0];
        if (!file || file.size > 4_000_000) {
          $("stage").textContent = "Ошибка";
          $("message").textContent = "Выберите файл cookies.txt размером до 4 МБ";
          return;
        }
        data.cookie_text = await file.text();
      }
      localStorage.setItem("video-downloader-settings", JSON.stringify({browser: data.browser, quality: data.quality, folder: data.folder}));
      await syncSettings();
      try { await api("/api/start", data); await refresh(); }
      catch (error) { $("stage").textContent = "Ошибка"; $("message").textContent = error.message; }
    });
    $("stop").addEventListener("click", async () => { try { await api("/api/cancel", {}); } catch (error) { $("message").textContent = error.message; } });
    $("close").addEventListener("click", async () => {
      try { await api("/api/shutdown", {}); closed = true; $("stage").textContent = "Приложение закрыто"; $("message").textContent = "Эту вкладку можно закрыть."; }
      catch (error) { $("message").textContent = error.message; }
    });
    syncSettings(); refresh(); setInterval(refresh, 900);
  </script>
</body>
</html>
