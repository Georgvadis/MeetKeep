name: Build apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза, например v0.3.0 (пусто — только сборка)'
        required: false
        default: ''
  push:
    branches: [main]
    # Path filters below are not applied to tag pushes, so every v* tag builds a release.
    tags: ['v*']
    paths:
      - .github/workflows/build.yml
      - build-windows.bat
      - build-mac.command
      - start-mac.command
      - index.html
      - requirements.txt
      - vidloader.py
      - extension/**

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Vidloader.exe
        shell: cmd
        run: build-windows.bat
      - name: Check single executable
        shell: pwsh
        run: |
          if (!(Test-Path dist/Vidloader.exe)) { throw 'Vidloader.exe was not created' }
          if (Test-Path dist/Vidloader) { throw 'Unexpected onedir folder next to Vidloader.exe' }
          Write-Host "Size: $((Get-Item dist/Vidloader.exe).Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: Vidloader-Windows-x64
          path: dist/Vidloader.exe
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Vidloader.app
        run: zsh build-mac.command
      - name: Check app bundle
        run: |
          test -x dist/Vidloader.app/Contents/MacOS/Vidloader
          test ! -e dist/Vidloader
          # ditto keeps the bundle's symlinks and metadata intact inside the zip.
          ditto -c -k --keepParent dist/Vidloader.app dist/Vidloader-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Vidloader-macOS-arm64
          path: dist/Vidloader-macOS.zip
          if-no-files-found: error

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Версия должна быть вида v0.3.0, получено: $TAG"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Тег $TAG уже существует, укажите новую версию"
            exit 1
          fi
          files=(assets/Vidloader-Windows-x64/Vidloader.exe assets/Vidloader-macOS-arm64/Vidloader-macOS.zip)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Vidloader ${TAG#v}" --generate-notes
          fi
