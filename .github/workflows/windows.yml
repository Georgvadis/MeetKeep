name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows.yml
      - build-windows.bat
      - index.html
      - requirements.txt
      - sbervideo_downloader.py
      - chrome_extension/**

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Vidloader.exe
        shell: cmd
        run: build-windows.bat
      - name: Check bundled executable
        shell: pwsh
        run: |
          if (!(Test-Path dist/Vidloader/Vidloader.exe)) { throw 'Vidloader.exe was not created' }
          if (!(Test-Path dist/Vidloader/_internal/ffmpeg.exe)) { throw 'Bundled FFmpeg was not created' }
          Write-Host "Size: $((Get-Item dist/Vidloader/Vidloader.exe).Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: Vidloader-Windows-x64
          path: dist/Vidloader/
          if-no-files-found: error
